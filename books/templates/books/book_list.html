<!DOCTYPE html>
<html>
<head>
    <title>Online Book Store</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f5f5f5;
            margin: 0;
        }

        header {
            background-color: #2c3e50;
            color: white;
            padding: 20px;
            text-align: center;
        }

        .container {
            width: 90%;
            margin: 30px auto;
        }

        .books {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 25px;
        }

        .book {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        .book img {
            width: 100%;
            height: 250px;
            object-fit: cover;
            border-radius: 5px;
        }

        .book h2 {
            margin-bottom: 8px;
        }

        .author {
            color: #666;
        }

        .price {
            font-size: 20px;
            font-weight: bold;
            color: #27ae60;
        }
    </style>
</head>

<body>

<header>
    <h1>📚 Online Book Store</h1>
    <p>Find your next favourite book</p>
</header>

<div class="container">

    <div class="books">

        {% for book in books %}

        <div class="book">

            {% if book.image %}
                <img src="{{ book.image.url }}" alt="{{ book.title }}">
            {% endif %}

            <h2>{{ book.title }}</h2>

            <p class="author">
                By {{ book.author }}
            </p>

            <p>
                {{ book.description }}
            </p>

            <p>
                Category: {{ book.category }}
            </p>

            <p class="price">
                ₹{{ book.price }}
            </p>

            <p>
                Stock: {{ book.stock }}
            </p>

        </div>

        {% empty %}

        <p>No books available.</p>

        {% endfor %}

    </div>

</div>

</body>
</html>
