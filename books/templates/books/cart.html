<!DOCTYPE html>
<html>
<head>
    <title>Shopping Cart</title>
</head>
<body>

    <h1>Shopping Cart</h1>

    {% if items %}

        {% for item in items %}
            <div>
                <h3>{{ item.book.title }}</h3>
                <p>Quantity: {{ item.quantity }}</p>
                <p>Price: ₹{{ item.book.price }}</p>
                <p>Subtotal: ₹{{ item.book.price|floatformat:2 }}</p>
            </div>
            <hr>
        {% endfor %}

        <h2>Total: ₹{{ total }}</h2>

    {% else %}

        <p>Your cart is empty.</p>
        <h2>Total: ₹0</h2>

    {% endif %}

    <br>

    <a href="{% url 'home' %}">
        <button>Continue Shopping</button>
    </a>

</body>
</html>
